<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Patient App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f5;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 20px;
      max-width: 450px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="card" id="loginScreen">
    <h2>Doctor Login</h2>
    <input placeholder="Doctor ID">
    <input type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- PATIENT SCREEN -->
  <div class="card hidden" id="patientScreen">
    <h2>New Patient</h2>
    <label>Patient ID</label>
    <input id="patientId" readonly>

    <label>Symptoms</label>
    <textarea placeholder="Enter symptoms"></textarea>

    <label>Signs</label>
    <textarea placeholder="Enter clinical signs"></textarea>

    <button>Save Patient</button>
  </div>

<script>
  function login() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("patientScreen").classList.remove("hidden");

    // Auto-generate Patient ID
    const pid = "PID-" + Math.floor(100000 + Math.random() * 900000);
    document.getElementById("patientId").value = pid;
  }
</script>

</body>
</html>
